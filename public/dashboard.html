<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi billetera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Billetera Digital</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white" id="user-name"></span>
                <button class="btn btn-outline-light btn-sm" id="logout-button" type="button">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="message" class="alert d-none" role="alert"></div>

        <div class="card text-bg-primary shadow-sm mb-4">
            <div class="card-body">
                <p class="mb-1">Saldo disponible</p>
                <p class="display-5 fw-bold mb-0" id="balance">...</p>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Añadir dinero</h2>
                        <form id="deposit-form">
                            <div class="mb-3">
                                <label for="deposit-amount" class="form-label">Monto</label>
                                <input type="number" class="form-control" id="deposit-amount" min="0.01" step="0.01"
                                    required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Añadir</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Enviar dinero</h2>
                        <form id="transfer-form">
                            <div class="mb-3">
                                <label for="transfer-email" class="form-label">Email del destinatario</label>
                                <input type="email" class="form-control" id="transfer-email" required>
                            </div>
                            <div class="mb-3">
                                <label for="transfer-amount" class="form-label">Monto</label>
                                <input type="number" class="form-control" id="transfer-amount" min="0.01" step="0.01"
                                    required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Enviar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 mb-3">Historial de movimientos</h2>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Detalle</th>
                                <th class="text-end">Monto</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>

</html>
